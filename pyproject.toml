[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Explicit so the pre-push gate is deterministic. B023 is ignored because the
# flagged closures are helpers called inside the same loop iteration that
# defines them — never stored, never late-bound (checked Sep 2026).
select = ["E4", "E7", "E9", "F", "B", "UP", "I", "RUF"]
# B905: zip(strict=) churn buys nothing here. RUF001-003: the arrows and
# times-signs in user-facing strings are intentional typography.
ignore = ["B023", "B905", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Research CLIs use the sys.path-shim-then-import pattern and a compact
# import style; they are operator tools, not library code.
"strategy/*" = ["E402", "E701", "E702"]
"scripts/*" = ["E402", "E701", "E702"]
